<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TincNote — Notlar & Listeler{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('tnote.static', filename='css/tnote.css') }}">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface2: #f1f5f9;
            --surface3: #e2e8f0;
            --border: #cbd5e1;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #3b82f6;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 2px 10px rgba(0,0,0,0.05);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header.standalone-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .header-nav {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .header-nav a {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-nav a.active, .header-nav a:hover {
            background: var(--surface2);
            color: var(--accent);
        }
        .standalone-container {
            padding: 14px 20px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="standalone-header">
        <a href="/notes" class="header-logo">
            <span>📝</span> <strong>TincNote</strong>
        </a>
        <nav class="header-nav">
            <a href="/notes" class="{% if request.path == '/notes' or request.path == '/notes/' %}active{% endif %}">📋 Notlar &amp; Listeler</a>
            <a href="/notes/settings" class="{% if request.path.startswith('/notes/settings') %}active{% endif %}">⚙️ Ayarlar</a>
            <a href="javascript:void(0)" onclick="window.location.href='http://'+window.location.hostname+':9010';" style="color: var(--muted); font-size: 0.85rem;" title="TincHub Ana Panosuna Dön">🏠 TincHub</a>
        </nav>
    </header>
    <div class="standalone-container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
