<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TincNote — Notlar & Listeler{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('tnote.static', filename='css/tinc_theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('tnote.static', filename='css/tnote.css') }}">
    <style>
        :root {
            --bg: var(--tinc-bg, #f8fafc);
            --surface: var(--tinc-surface, #ffffff);
            --surface2: var(--tinc-surface-alt, #f1f5f9);
            --surface3: var(--tinc-border, #e2e8f0);
            --border: var(--tinc-border, #e2e8f0);
            --text: var(--tinc-text, #0f172a);
            --text-secondary: #475569;
            --muted: var(--tinc-text-muted, #64748b);
            --accent: var(--tinc-primary, #0284c7);
            --green: var(--tinc-primary, #0284c7);
            --yellow: #f59e0b;
            --red: #ef4444;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow: 0 1px 3px rgba(0,0,0,0.03);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header.standalone-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-logo {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex-shrink: 0;
            letter-spacing: -0.01em;
        }
        .header-logo-icon {
            color: var(--accent);
            display: flex;
            align-items: center;
        }
        .header-search-area {
            flex: 1;
            max-width: 480px;
            display: flex;
            justify-content: center;
        }
        .header-nav {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .header-nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-nav-link:hover {
            background: var(--surface2);
            color: var(--text);
        }
        .header-nav-link.active {
            background: #f0f9ff;
            color: var(--accent);
            font-weight: 600;
        }
        .standalone-container {
            padding: 12px 16px;
            width: 100%;
            max-width: 1680px;
            margin: 0 auto;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% include "tnote/_icons.html" %}
    <header class="standalone-header">
        <a href="/notes" class="header-logo">
            <span class="header-logo-icon"><svg class="svg-icon svg-icon-lg"><use href="#i-book"/></svg></span>
            <span>TincNote</span>
        </a>
        <div class="header-nav">
            <a href="/notes" class="header-nav-link {% if request.path == '/notes' or request.path == '/notes/' %}active{% endif %}" title="Notlar & Listeler">
                <svg class="svg-icon"><use href="#i-file-text"/></svg>
                <span>Notlar &amp; Listeler</span>
            </a>
            <a href="/notes/settings" class="header-nav-link {% if request.path.startswith('/notes/settings') %}active{% endif %}" title="Ayarlar">
                <svg class="svg-icon"><use href="#i-settings"/></svg>
                <span>Ayarlar</span>
            </a>
            <a href="javascript:void(0)" onclick="window.location.href='http://'+window.location.hostname+':9010';" class="header-nav-link" title="TincHub Ana Panosu">
                <svg class="svg-icon"><use href="#i-home"/></svg>
                <span>TincHub</span>
            </a>
        </div>
    </header>
    <div class="standalone-container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
