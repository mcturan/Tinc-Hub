<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - Tinc Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-box">
            <div class="login-logo">
                <span class="logo-icon">⚙</span>
                <strong>TINC</strong> Hub
            </div>
            
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            
            <form method="POST" action="">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" name="username" value="admin" required autofocus placeholder="Kullanıcı adınız...">
                </div>
                <div class="form-group" style="margin-top:15px;">
                    <label>Şifre</label>
                    <input type="password" name="password" required placeholder="Şifrenizi girin...">
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 0.95rem; padding: 10px;">Giriş Yap</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
