<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if refresh %}
    <meta http-equiv="refresh" content="{{ refresh }}">
    {% endif %}
    <title>Tinc Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-icon">⚙</span>
                <span class="logo-text">TINC <strong>Hub</strong></span>
            </a>
            <nav>
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Hub</a>
                <a href="/logs" class="{% if request.path.startswith('/logs') %}active{% endif %}">Loglar</a>
                <a href="/settings" class="{% if request.path.startswith('/settings') %}active{% endif %}">Ayarlar</a>
            </nav>
            <div class="header-actions">
                <div class="header-time">{{ now }}</div>
                {% if has_auth %}
                <a href="/logout" class="btn btn-sm">Çıkış</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <span>Tinc Hub v2 · Sistem Yönetim Merkezi</span>
    </footer>

    {% block scripts %}{% endblock %}
    <script>
    async function deleteApp(appId, appName) {
        try {
            const rApps = await fetch('/api/settings/apps');
            const apps = await rApps.json();
            const children = apps.filter(a => a.parent === appId || (a.parent && a.parent === apps.find(x => x.id === appId)?.service));
            if (children.length > 0) {
                const childNames = children.map(c => c.name).join(', ');
                if (!confirm(`DİKKAT: '${appName}' uygulamasını siliyorsunuz, ancak şu uygulamalar ona bağlı: ${childNames}\n\nYine de silmek istiyor musunuz?`)) {
                    return;
                }
            }
            
            // Tamamen kaldırma sorusu
            let fullUninstall = false;
            if(confirm(`'${appName}' uygulamasını sistemden tamamen kaldırmak (uninstall/stop/disable) istiyor musunuz?\n\n- İptal derseniz sadece Hub panosundan silinir, arka planda çalışmaya devam eder.\n- Tamam derseniz sistemden sökülür.`)) {
                fullUninstall = true;
            } else {
                if(!confirm(`Sadece Hub panosundan silinecek. Emin misiniz?`)) return;
            }
            
            const r = await fetch(`/api/settings/apps/${appId}?uninstall=${fullUninstall}`, {method: 'DELETE'});
            if(r.ok) location.reload();
            else {
                const res = await r.json();
                alert(`Hata: ${res.error || 'Silinemedi!'}`);
            }
        } catch(e) { alert("Hata: "+e); }
    }
    
    async function deleteDocker(containerId, containerName) {
        if(!confirm(`'${containerName}' Docker container'ını sistemden tamamen SİLMEK istediğinize emin misiniz?`)) return;
        try {
            const r = await fetch(`/api/docker/${containerId}`, {method: 'DELETE'});
            if(r.ok) location.reload();
            else alert("Silinemedi!");
        } catch(e) { alert("Hata: "+e); }
    }
    </script>
</body>
</html>
