# TINC Köle Hub — nginx yapılandırması
# Harici erişim için /etc/nginx/sites-available/kole-hub olarak kopyala
# Sonra: ln -s /etc/nginx/sites-available/kole-hub /etc/nginx/sites-enabled/

# HTTP → HTTPS yönlendirme (Let's Encrypt sonrası otomatik eklenir)
# server {
#     listen 80;
#     server_name kole.ALAN_ADINIZ.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl;
    # listen 80;   # SSL yoksa bunu kullan, yukarıdaki bloğu sil

    # Alan adınızı buraya girin (yoksa IP kullanın):
    server_name kole.ALAN_ADINIZ.com;

    # SSL sertifikası (Let's Encrypt için certbot ile otomatik doldurulur)
    # ssl_certificate     /etc/letsencrypt/live/kole.ALAN_ADINIZ.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kole.ALAN_ADINIZ.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # ─── SSE (Log Streaming) için kritik ayarlar ──────────────
    # Log streaming akışının buffer olmadan gitmesi için:
    proxy_buffering          off;
    proxy_cache              off;
    proxy_read_timeout       3600s;   # 1 saat açık bağlantı
    proxy_send_timeout       3600s;

    # ─── Genel Proxy Ayarları ─────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:9010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";  # Keep-alive için
    }

    # ─── SSE endpoint için özel blok ──────────────────────────
    location /api/logs/stream/ {
        proxy_pass         http://127.0.0.1:9010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        keep-alive;

        # SSE için buffer kapalı
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering no;

        # Uzun bağlantılar için
        proxy_read_timeout 86400s;
        keepalive_timeout  86400s;
    }

    # ─── Static dosyalar için cache ───────────────────────────
    location /static/ {
        proxy_pass       http://127.0.0.1:9010;
        proxy_cache_valid 200 1h;
        add_header       Cache-Control "public, max-age=3600";
    }

    # ─── Güvenlik Header'ları ─────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy        "same-origin";
}
