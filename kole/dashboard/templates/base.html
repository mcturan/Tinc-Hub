<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if refresh %}
    <meta http-equiv="refresh" content="{{ refresh }}">
    {% endif %}
    <title>TINC Köle</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-icon">⚙</span>
                <span class="logo-text">TINC <strong>Köle</strong></span>
            </a>
            <nav>
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Hub</a>
                <a href="/apps" class="{% if request.path.startswith('/apps') %}active{% endif %}">Uygulamalar</a>
                <a href="/logs" class="{% if request.path.startswith('/logs') %}active{% endif %}">Loglar</a>
                <a href="/settings" class="{% if request.path.startswith('/settings') %}active{% endif %}">Ayarlar</a>
            </nav>
            <div class="header-actions">
                <div class="header-time">{{ now }}</div>
                {% if has_auth %}
                <a href="/logout" class="btn btn-sm">Çıkış</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <span>TINC Köle Hub v2 · Sistem Yönetim Merkezi</span>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
